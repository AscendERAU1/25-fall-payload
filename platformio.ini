; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:adafruit_feather_f405]
platform = ststm32
board = adafruit_feather_f405
framework = arduino
upload_protocol = dfu
build_flags = 
	-D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC
monitor_speed = 9600
monitor_dtr = 1
lib_deps = 
	adafruit/Adafruit GPS Library@^1.7.5
	adafruit/Adafruit BNO055@^1.6.4
	adafruit/Adafruit LSM6DS@^4.7.4
	sensirion/Sensirion I2C SCD4x@^1.0.0
	adafruit/Adafruit AS7341@^1.4.1
	adafruit/Adafruit BMP3XX Library@^2.1.6
	adafruit/Adafruit LTR390 Library@^1.1.2
	adafruit/Adafruit BME680 Library@^2.0.6
	adafruit/Adafruit NeoPixel@^1.12.4
	stm32duino/STM32duino STM32SD@^1.3.2
	https://github.com/stm32duino/FatFs.git#4.0.0