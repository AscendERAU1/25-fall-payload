; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:adafruit_feather_f405]
platform = ststm32
board = adafruit_feather_f405
framework = arduino
upload_protocol = dfu
lib_deps =
	adafruit/Adafruit GPS Library@^1.7.5
	adafruit/Adafruit BNO055@^1.6.4
	bitbank2/bb_scd41@^1.1.0
	sensirion/Sensirion I2C SCD4x@^1.0.0
	adafruit/Adafruit AS7341@^1.4.1
	adafruit/Adafruit BMP3XX Library@^2.1.6
	adafruit/Adafruit LTR390 Library@^1.1.2
	adafruit/Adafruit BME680 Library@^2.0.6
	adafruit/Adafruit NeoPixel@^1.12.4
	adafruit/Adafruit BMP3XX Library @ ^2.1.6
; build_flags = -D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC ; Serial can either be over USB-c (uncomment this line) or over the RX/TX pins (comment this line)
